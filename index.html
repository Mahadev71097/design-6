<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3e8d6">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Great+Vibes&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f3e8d6; --cream-2:#fbf4e8; --ivory:#fffdf8;
  --gold:#c9a24a; --gold-deep:#a8842f; --gold-soft:#e4c877;
  --maroon:#5e1526; --maroon-2:#7a1f31; --rose:#c98a86;
  --ink:#4a2a20; --shadow:rgba(60,25,15,.28);
  --serif:"Cormorant Garamond",serif; --body:"EB Garamond",serif; --script:"Great Vibes",cursive;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);color:var(--ink);background:#2a1712;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;max-width:100%}
.stage{position:relative;width:100%;max-width:480px;margin:0 auto;background:var(--cream);overflow:clip}

/* shared */
.frame{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;isolation:isolate}
.frame .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;will-change:transform}
.frame .veil{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 80% at 50% 40%,rgba(255,250,240,.4),rgba(255,247,233,.06) 55%,rgba(60,30,15,.2));pointer-events:none}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(18px,5.5vw,32px)}

.eyebrow{font-family:var(--serif);letter-spacing:.34em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;font-size:clamp(10px,2.9vw,13px)}
.divider{display:flex;align-items:center;justify-content:center;gap:.55em;color:var(--gold);margin:.5em 0;font-size:13px}
.divider::before,.divider::after{content:"";height:1px;width:clamp(30px,9vw,54px);background:linear-gradient(90deg,transparent,var(--gold))}
.divider::after{background:linear-gradient(90deg,var(--gold),transparent)}
.heart-i{color:var(--maroon);font-size:.82em}
.sec-title{text-align:center}
.sec-title .big{font-family:var(--serif);font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--maroon);font-size:clamp(30px,10vw,52px);line-height:.92}
.sec-title .big em{font-style:normal;display:block;font-weight:600;font-size:.44em;letter-spacing:.16em}
.sec-sub{font-family:var(--serif);text-transform:uppercase;letter-spacing:.13em;color:var(--gold-deep);text-align:center;font-size:clamp(10px,2.9vw,13px);line-height:1.8;max-width:26ch;margin:6px auto 0}
.foot{margin-top:auto;text-align:center;padding-top:12px}
.foot .a{font-family:var(--serif);text-transform:uppercase;letter-spacing:.1em;color:var(--maroon);font-size:clamp(12px,3.5vw,16px)}
.foot .b{font-family:var(--script);color:var(--gold-deep);font-size:clamp(26px,8vw,40px);line-height:1;margin-top:1px}

/* ---- INTRO ---- */
#intro{position:fixed;inset:0;z-index:100;background:#241009;display:flex;align-items:center;justify-content:center}
#intro .wrap{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden}
#intro .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.14)}}
#intro .scrim{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 42%,rgba(30,12,6,.12),rgba(30,12,6,.74))}
#intro .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px}
#intro .il-top,#intro .il-quote,#intro .il-btn{opacity:0;transform:translateY(20px);animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}
#intro .il-top{animation-delay:.25s}#intro .il-quote{animation-delay:.55s}#intro .il-btn{animation-delay:.9s}
@keyframes rise{to{opacity:1;transform:none}}
#intro .names{font-family:var(--script);color:#f8e8cb;font-size:clamp(46px,15vw,74px);text-shadow:0 3px 26px rgba(0,0,0,.55);line-height:.9}
#intro .q{font-family:var(--serif);letter-spacing:.22em;text-transform:uppercase;color:#f0dcb6;font-size:clamp(11px,3.1vw,14px);max-width:22ch;line-height:1.9;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.open-btn{margin-top:6px;width:clamp(118px,34vw,152px);height:clamp(118px,34vw,152px);border-radius:50%;border:1px solid rgba(248,232,203,.55);background:radial-gradient(circle at 50% 38%,rgba(94,21,38,.92),rgba(60,12,24,.94));color:#f7e7c8;font-family:var(--serif);letter-spacing:.14em;text-transform:uppercase;font-size:clamp(11px,3.2vw,14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:0 12px 44px rgba(0,0,0,.5),inset 0 0 0 6px rgba(201,162,74,.25);animation:pulse 2.6s ease-in-out infinite;transition:transform .3s}
.open-btn:active{transform:scale(.93)}
.open-btn .tap{font-family:var(--script);text-transform:none;letter-spacing:0;font-size:2em;line-height:.8}
@keyframes pulse{0%,100%{box-shadow:0 12px 44px rgba(0,0,0,.5),inset 0 0 0 6px rgba(201,162,74,.28),0 0 0 0 rgba(201,162,74,.4)}50%{box-shadow:0 12px 44px rgba(0,0,0,.5),inset 0 0 0 6px rgba(201,162,74,.42),0 0 0 15px rgba(201,162,74,0)}}
#intro.hide{opacity:0;pointer-events:none;transition:opacity .9s ease}

/* ---- MUSIC BUTTON ---- */
#music{position:fixed;z-index:90;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(201,162,74,.6);background:rgba(94,21,38,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#f7e7c8;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .3s}
#music.show{display:flex}
#music:active{transform:scale(.9)}
#music svg{width:20px;height:20px}
#music .wave{transform-origin:center;animation:spin 6s linear infinite}
#music.paused .wave{animation-play-state:paused;opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- HERO ---- */
#hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#hero .frozen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .6s}
#hero .content{justify-content:flex-end;padding-bottom:clamp(30px,10vw,54px);text-align:center}
.hero-el{opacity:0;transform:translateY(28px);transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1)}
#hero.revealed .hero-el{opacity:1;transform:none}
#hero.revealed .hero-el.d1{transition-delay:.1s}#hero.revealed .hero-el.d2{transition-delay:.3s}
#hero.revealed .hero-el.d3{transition-delay:.55s}#hero.revealed .hero-el.d4{transition-delay:.75s}#hero.revealed .hero-el.d5{transition-delay:.95s}
.hero-together{color:#f3e0bb;font-family:var(--serif);letter-spacing:.3em;text-transform:uppercase;font-size:clamp(10px,2.9vw,13px);text-shadow:0 2px 12px rgba(0,0,0,.6);margin-bottom:2px}
.hero-names{font-family:var(--script);color:#fbeccb;font-size:clamp(52px,17vw,86px);line-height:.86;text-shadow:0 4px 28px rgba(0,0,0,.55)}
.hero-names .amp{font-family:var(--serif);font-style:italic;font-size:.4em;color:var(--gold-soft);text-transform:lowercase;display:block;margin:.02em 0;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero-date{color:#f7e7c8;font-family:var(--serif);letter-spacing:.2em;text-transform:uppercase;font-size:clamp(13px,3.7vw,17px);text-shadow:0 2px 12px rgba(0,0,0,.55);margin-top:8px}
.hero-date .dot{color:var(--gold-soft)}
.hero-cue{margin-top:14px;color:#efd9ac;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-family:var(--serif);animation:bob 2s ease-in-out infinite}
.hero-cue span{display:block;font-size:17px;margin-top:2px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* reveal util */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .95s cubic-bezier(.22,1,.36,1),transform .95s cubic-bezier(.22,1,.36,1)}
.in .reveal{opacity:1;transform:none}
.in .reveal.s1{transition-delay:.06s}.in .reveal.s2{transition-delay:.18s}.in .reveal.s3{transition-delay:.3s}
.in .reveal.s4{transition-delay:.42s}.in .reveal.s5{transition-delay:.54s}.in .reveal.s6{transition-delay:.66s}
.sec .bg{transform:scale(1.12)}

/* ---- EVENTS ---- */
#events .content{gap:1px;padding-top:clamp(18px,5vw,28px)}
.ev-cards{display:flex;flex-direction:column;gap:clamp(9px,2.4vw,14px);width:100%;margin-top:5px}
.card{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(8px,2.4vw,13px);background:linear-gradient(160deg,var(--ivory),var(--cream-2));border-radius:16px;padding:clamp(9px,2.7vw,14px);box-shadow:0 6px 22px var(--shadow),inset 0 0 0 1.5px rgba(201,162,74,.55),inset 0 0 0 4px rgba(201,162,74,.12);overflow:hidden;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px var(--shadow),inset 0 0 0 1.5px rgba(201,162,74,.7),inset 0 0 0 4px rgba(201,162,74,.16)}
.card::after{content:"";position:absolute;bottom:-20px;right:-16px;width:100px;height:100px;background:radial-gradient(circle,rgba(201,162,74,.16),transparent 70%);pointer-events:none}
.card .ic{width:clamp(54px,16vw,74px);height:auto;filter:drop-shadow(0 3px 6px rgba(120,80,20,.2))}
.card .mid{min-width:0}
.card .etitle{font-family:var(--script);color:var(--maroon);font-size:clamp(25px,7.6vw,37px);line-height:.9}
.card .esub{font-family:var(--serif);text-transform:uppercase;letter-spacing:.05em;color:var(--gold-deep);font-size:clamp(8.5px,2.4vw,11px);margin-top:2px;line-height:1.3}
.card .btn{margin-top:7px;display:inline-block;background:linear-gradient(var(--maroon),var(--maroon-2));color:#f7e7c8;font-family:var(--serif);letter-spacing:.12em;text-transform:uppercase;font-size:clamp(8px,2.3vw,10px);padding:5px 13px;border-radius:20px;border:none;cursor:pointer;box-shadow:0 3px 10px rgba(94,21,38,.4);transition:transform .25s,filter .25s}
.card .btn:active{transform:scale(.92)}.card .btn:hover{filter:brightness(1.12)}
.card .when{text-align:left;border-left:1px solid rgba(201,162,74,.5);padding-left:clamp(7px,2.3vw,12px);font-family:var(--serif)}
.card .wd{color:var(--maroon);font-weight:600;font-size:clamp(12px,3.3vw,16px);line-height:1.05;letter-spacing:.01em}
.card .wday{color:var(--gold-deep);text-transform:uppercase;letter-spacing:.08em;font-size:clamp(7.5px,2.2vw,10px);margin:2px 0 6px}
.card .wtime{color:var(--ink);font-size:clamp(9px,2.5vw,11px);display:flex;align-items:center;gap:4px}
.count{display:flex;gap:clamp(7px,2.6vw,15px);margin-top:clamp(11px,2.8vw,16px)}
.count .u{display:flex;flex-direction:column;align-items:center;min-width:clamp(44px,13.5vw,60px)}
.count .n{font-family:var(--serif);font-weight:700;color:var(--maroon);font-size:clamp(24px,8vw,38px);line-height:1;background:linear-gradient(var(--ivory),var(--cream-2));border-radius:12px;padding:8px 4px;width:100%;text-align:center;box-shadow:0 4px 14px var(--shadow),inset 0 0 0 1px rgba(201,162,74,.5)}
.count .l{font-family:var(--serif);text-transform:uppercase;letter-spacing:.15em;color:var(--gold-deep);font-size:clamp(7.5px,2.2vw,10px);margin-top:6px}

/* ---- GALLERY (matches reference: 3 tall arches + 3 rounded, gold surround) ---- */
#gallery .content{padding-top:clamp(20px,5.5vw,30px)}
.g-wrap{position:relative;width:100%;margin:auto 0;padding:clamp(8px,2.4vw,14px);border-radius:24px;box-shadow:inset 0 0 0 2px rgba(201,162,74,.55),inset 0 0 0 6px rgba(201,162,74,.14);background:radial-gradient(120% 100% at 50% 0,rgba(255,253,248,.5),rgba(243,232,214,.2))}
.g-top{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:clamp(5px,1.6vw,9px);align-items:end}
.g-bot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(5px,1.6vw,9px);margin-top:clamp(5px,1.6vw,9px)}
.g-cell{position:relative;overflow:hidden;box-shadow:0 5px 16px var(--shadow),inset 0 0 0 2px rgba(201,162,74,.65);background:#e9d9bf}
.g-top .g-cell{border-radius:120px 120px 12px 12px;aspect-ratio:3/4.1}
.g-top .g-cell.tall{aspect-ratio:3/4.9;border-radius:120px 120px 10px 10px}
.g-bot .g-cell{border-radius:12px 12px 46px 46px;aspect-ratio:1/1.08}
.g-cell img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transform:scale(1.08);transition:opacity 1.1s ease,transform 6s ease-out}
.g-cell img.on{opacity:1;transform:scale(1)}

/* ---- ADDRESS ---- */
#address .content{padding-top:clamp(14px,4vw,22px);gap:1px}
#address .divider{margin:.28em 0}
#address .sec-title .big{font-size:clamp(28px,9.4vw,46px)}
.venue-card{position:relative;width:100%;border-radius:18px;overflow:hidden;margin-top:8px;box-shadow:0 8px 26px var(--shadow),inset 0 0 0 2px rgba(201,162,74,.6)}
.venue-card img{width:100%;aspect-ratio:16/9.4;object-fit:cover}
.map-badge{position:absolute;right:12px;bottom:-22px;width:clamp(66px,18vw,84px);height:clamp(66px,18vw,84px);border-radius:50%;background:radial-gradient(circle at 50% 38%,var(--maroon),var(--maroon-2));color:#f7e7c8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);text-transform:uppercase;letter-spacing:.07em;font-size:clamp(8px,2.3vw,10px);line-height:1.15;text-decoration:none;box-shadow:0 8px 22px rgba(94,21,38,.5),inset 0 0 0 3px rgba(201,162,74,.45);transition:transform .3s;z-index:3}
.map-badge:active{transform:scale(.92)}
.map-badge .pin{font-size:1.5em;margin-bottom:1px}
.info-card{width:100%;background:linear-gradient(160deg,var(--ivory),var(--cream-2));border-radius:16px;margin-top:26px;padding:clamp(14px,4vw,20px) clamp(14px,4vw,20px) clamp(12px,3.4vw,16px);text-align:center;box-shadow:0 6px 20px var(--shadow),inset 0 0 0 1.5px rgba(201,162,74,.5);position:relative}
.info-card .pin-top{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:linear-gradient(var(--gold-soft),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 10px rgba(120,80,20,.4)}
.info-card .vname{font-family:var(--serif);font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--maroon);font-size:clamp(16px,4.8vw,22px);margin-top:6px}
.info-card .addr{font-family:var(--body);color:var(--ink);font-size:clamp(11px,3.2vw,14px);line-height:1.55;margin-top:4px}
.info-row{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid rgba(201,162,74,.4)}
.info-row .it{flex:1;font-family:var(--serif);text-transform:uppercase;letter-spacing:.04em;color:var(--gold-deep);font-size:clamp(8px,2.2vw,10px);line-height:1.4}
.info-row .it .ico{display:block;font-size:1.7em;margin-bottom:3px;filter:grayscale(.1)}
.info-row .it+.it{border-left:1px solid rgba(201,162,74,.35)}
.map-embed{width:100%;margin-top:12px;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px var(--shadow),inset 0 0 0 1.5px rgba(201,162,74,.5);aspect-ratio:16/7.6;background:#e9d9bf}
.map-embed iframe{width:100%;height:100%;border:0;display:block}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.001s!important}
  .reveal,.hero-el{opacity:1!important;transform:none!important}
  .g-cell img{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="wrap">
    <img class="poster" id="introPoster" alt="">
    <div class="scrim"></div>
    <div class="center">
      <div class="names il-top" id="introNames"></div>
      <div class="q il-quote" id="introQuote"></div>
      <button class="open-btn il-btn" id="openBtn" aria-label="Open invitation">
        <span class="tap" id="openLabel"></span>
        <span id="openSub"></span>
      </button>
    </div>
  </div>
</div>

<!-- MUSIC -->
<button id="music" class="paused" aria-label="Toggle music">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <g class="wave"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></g>
  </svg>
</button>
<audio id="audio" loop preload="none"></audio>

<div class="stage" id="stage">

  <!-- HERO -->
  <section class="frame sec" id="hero">
    <video id="heroVid" playsinline muted preload="none"></video>
    <img class="frozen" id="frozen" alt="">
    <div class="veil"></div>
    <div class="content">
      <div class="hero-together hero-el d1" id="heroEyebrow"></div>
      <div class="hero-names hero-el d2" id="heroNames"></div>
      <div class="hero-date hero-el d4" id="heroDate"></div>
      <div class="hero-cue hero-el d5">Scroll<span>⌄</span></div>
    </div>
  </section>

  <!-- EVENTS -->
  <section class="frame sec" id="events">
    <img class="bg" id="evbg" alt="">
    <div class="veil"></div>
    <div class="content">
      <div class="eyebrow reveal s1">Celebrate with us</div>
      <div class="sec-title reveal s1"><div class="big">Our Events</div></div>
      <div class="divider reveal s1">✿ <span class="heart-i">♥</span> ✿</div>
      <div class="ev-cards" id="evCards"></div>
      <div class="count reveal s5" id="count" aria-label="Countdown">
        <div class="u"><div class="n" id="cd">--</div><div class="l">Days</div></div>
        <div class="u"><div class="n" id="ch">--</div><div class="l">Hours</div></div>
        <div class="u"><div class="n" id="cm">--</div><div class="l">Mins</div></div>
        <div class="u"><div class="n" id="cs">--</div><div class="l">Secs</div></div>
      </div>
      <div class="foot reveal s6"><div class="a" id="evFootA"></div><div class="b" id="evFootB"></div></div>
    </div>
  </section>

  <!-- GALLERY -->
  <section class="frame sec" id="gallery">
    <img class="bg" id="glbg" alt="">
    <div class="veil"></div>
    <div class="content">
      <div class="eyebrow reveal s1">A collection of moments</div>
      <div class="sec-title reveal s1"><div class="big">Our Story<em>in frames</em></div></div>
      <div class="divider reveal s1">✿ <span class="heart-i">♥</span> ✿</div>
      <div class="g-wrap reveal s2">
        <div class="g-top">
          <div class="g-cell"><img data-g="topLeft" alt=""></div>
          <div class="g-cell tall"><img data-g="topCenter" alt=""></div>
          <div class="g-cell"><img data-g="topRight" alt=""></div>
        </div>
        <div class="g-bot">
          <div class="g-cell"><img data-g="botLeft" alt=""></div>
          <div class="g-cell"><img data-g="botCenter" alt=""></div>
          <div class="g-cell"><img data-g="botRight" alt=""></div>
        </div>
      </div>
      <div class="foot reveal s5"><div class="a" id="glFootA"></div><div class="b" id="glFootB"></div></div>
    </div>
  </section>

  <!-- ADDRESS -->
  <section class="frame sec" id="address">
    <img class="bg" id="adbg" alt="">
    <div class="veil"></div>
    <div class="content">
      <div class="eyebrow reveal s1">Find our</div>
      <div class="sec-title reveal s1"><div class="big">Address</div></div>
      <div class="divider reveal s1">✿ <span class="heart-i">♥</span> ✿</div>
      <div class="sec-sub reveal s1" id="adSub"></div>
      <div class="venue-card reveal s2">
        <img data-venue alt="">
        <a class="map-badge" id="mapBadge" target="_blank" rel="noopener"><span class="pin">📍</span>View on map</a>
      </div>
      <div class="info-card reveal s3">
        <div class="pin-top">📍</div>
        <div class="vname" id="adName"></div>
        <div class="divider" style="justify-content:center">✦ <span class="heart-i">♥</span> ✦</div>
        <div class="addr" id="adAddr"></div>
        <div class="info-row" id="adFeatures"></div>
      </div>
      <div class="map-embed reveal s4"><iframe id="mapEmbed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <div class="foot reveal s5"><div class="a" id="adFootA"></div><div class="b" id="adFootB"></div></div>
    </div>
  </section>

</div>

<script src="config.js"></script>
<script>
(function(){
  var C=window.WEDDING||{};
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(id){return document.getElementById(id);};
  function psrc(base){return base;} // helper

  // ---- POPULATE FROM CONFIG ----
  document.title=C.coupleShort||"Wedding Invitation";
  $('introPoster').src=C.media.heroPoster;
  $('introNames').textContent=C.coupleShort;
  $('introQuote').textContent=C.introQuote;
  $('openLabel').textContent=C.openButtonLabel;
  $('openSub').textContent=C.openButtonSub;

  // hero
  $('heroEyebrow').textContent=C.heroEyebrow;
  $('heroNames').innerHTML=esc(C.groomName)+'<span class="amp">and</span>'+esc(C.brideName);
  $('heroDate').innerHTML=C.heroDate.replace(/·/g,'<span class="dot">·</span>')+' &nbsp;•&nbsp; '+esc(C.heroDay);
  var vid=$('heroVid');
  vid.poster=C.media.heroPoster;
  vid.innerHTML='<source src="'+C.media.heroVideoWebm+'" type="video/webm"><source src="'+C.media.heroVideoMp4+'" type="video/mp4">';
  $('frozen').src=C.media.heroFrozen;

  // section backgrounds (webp with jpg fallback)
  ['evbg','glbg','adbg'].forEach(function(id){
    var im=$(id); im.src=C.media.sectionBg+'.webp';
    im.onerror=function(){im.onerror=null;im.src=C.media.sectionBg+'.jpg';};
  });

  // events
  var ic={mehendi:'assets/img/icon-mehendi.png',muhurta:'assets/img/icon-muhurta.png',reception:'assets/img/icon-reception.png'};
  var ev=$('evCards'); var delay=['s2','s3','s4','s5','s6'];
  (C.events||[]).forEach(function(e,i){
    var icon=ic[e.icon]||('assets/img/'+e.icon+'.png');
    var a=document.createElement('article');
    a.className='card reveal '+(delay[i]||'s6');
    a.innerHTML='<img class="ic" src="'+icon+'" alt=""><div class="mid"><div class="etitle">'+esc(e.title)+'</div><div class="esub">'+esc(e.tagline)+'</div><button class="btn">View details</button></div><div class="when"><div class="wd">'+esc(e.date)+'</div><div class="wday">'+esc(e.day)+'</div><div class="wtime">🕐 '+esc(e.time)+'</div></div>';
    ev.appendChild(a);
  });
  $('evFootA').textContent=C.eventsFooterTop; $('evFootB').textContent=C.eventsFooterScript;

  // gallery
  var g=C.gallery.photos;
  document.querySelectorAll('#gallery img[data-g]').forEach(function(im){
    im.dataset.src='assets/img/'+g[im.getAttribute('data-g')];
  });
  document.querySelector('#gallery .eyebrow').textContent='A collection of moments';
  $('glFootA').textContent=C.gallery.footerTop; $('glFootB').textContent=C.gallery.footerScript;

  // address
  var v=C.venue;
  $('adSub').textContent=v.subtitle;
  var vimg=document.querySelector('#address img[data-venue]');
  vimg.dataset.src='assets/img/'+v.image;
  $('mapBadge').href=v.mapLink;
  $('adName').textContent=v.name;
  $('adAddr').innerHTML=v.addressLines.map(esc).join('<br>');
  $('adFeatures').innerHTML=v.features.map(function(f){return '<div class="it"><span class="ico">'+f.icon+'</span>'+esc(f.label)+'</div>';}).join('');
  $('mapEmbed').src=v.mapEmbed;
  $('adFootA').textContent=v.footerTop; $('adFootB').textContent=v.footerScript;

  function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  // ---- MUSIC ----
  var audio=$('audio'), mbtn=$('music'), musicReady=false;
  audio.src=C.media.music;
  function playMusic(){audio.play().then(function(){mbtn.classList.remove('paused');}).catch(function(){});}
  function pauseMusic(){audio.pause();mbtn.classList.add('paused');}
  mbtn.addEventListener('click',function(){ if(audio.paused)playMusic(); else pauseMusic(); });

  // ---- INTRO / OPEN ----
  var intro=$('intro'), openBtn=$('openBtn'), frozen=$('frozen'), hero=$('hero'), revealed=false;
  function revealHero(){ if(revealed)return; revealed=true; frozen.style.opacity='1'; hero.classList.add('revealed'); }
  openBtn.addEventListener('click',function(){
    mbtn.classList.add('show');
    audio.load();
    if(C.media.musicOnByDefault) playMusic();
    vid.setAttribute('preload','auto'); vid.load();
    var p=vid.play();
    intro.classList.add('hide');
    setTimeout(function(){intro.style.display='none';},900);
    if(reduce){vid.pause();revealHero();return;}
    vid.addEventListener('ended',function(){vid.pause();revealHero();});
    setTimeout(function(){if(!revealed)revealHero();},6600);
    if(p&&p.catch)p.catch(function(){revealHero();});
  },{once:true});

  // ---- SCROLL REVEAL ----
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add('in');
        if(e.target.id==='gallery')runGallery();
        e.target.querySelectorAll('img[data-src]').forEach(loadImg);
        var vi=e.target.querySelector('img[data-venue]'); if(vi)loadVenue(vi);
      }
    });
  },{threshold:.26});
  document.querySelectorAll('.sec').forEach(function(s){io.observe(s);});

  function loadImg(im){ if(im.src)return; var s=im.dataset.src; im.src=s+'.webp'; im.onerror=function(){im.onerror=null;im.src=s+'.jpg';}; }
  function loadVenue(im){ if(im.src)return; var s=im.dataset.src; im.src=s+'.webp'; im.onerror=function(){im.onerror=null;im.src=s+'.jpg';}; }

  // gallery staggered slideshow
  var gStarted=false;
  function runGallery(){
    if(gStarted)return; gStarted=true;
    var imgs=[].slice.call(document.querySelectorAll('#gallery .g-cell img'));
    // reveal order: center door first, then sides, then bottom
    var order=[1,0,2,3,4,5];
    order.forEach(function(idx,i){
      var im=imgs[idx];
      setTimeout(function(){ if(!im.src){im.src=im.dataset.src+'.webp';im.onerror=function(){im.onerror=null;im.src=im.dataset.src+'.jpg';};} im.classList.add('on'); },230*i+180);
    });
  }

  // ---- PARALLAX BG ----
  var bgs=[].slice.call(document.querySelectorAll('.sec .bg'));
  var ticking=false;
  function onScroll(){
    if(ticking)return; ticking=true;
    requestAnimationFrame(function(){
      var vh=innerHeight;
      bgs.forEach(function(bg){
        var r=bg.parentElement.getBoundingClientRect();
        var prog=(r.top-vh)/-(vh+r.height);
        var y=(prog-0.5)*42;
        bg.style.transform='scale(1.14) translateY('+y.toFixed(1)+'px)';
      });
      ticking=false;
    });
  }
  addEventListener('scroll',onScroll,{passive:true}); onScroll();

  // ---- COUNTDOWN ----
  var target=new Date(C.countdownTarget).getTime();
  var cd=$('cd'),ch=$('ch'),cm=$('cm'),cs=$('cs');
  function pad(n){return (n<10?'0':'')+n;}
  function tick(){var t=target-Date.now();if(t<0)t=0;
    cd.textContent=Math.floor(t/864e5);ch.textContent=pad(Math.floor(t/36e5)%24);
    cm.textContent=pad(Math.floor(t/6e4)%60);cs.textContent=pad(Math.floor(t/1e3)%60);}
  tick(); setInterval(tick,1000);

  // event buttons -> gallery
  document.addEventListener('click',function(e){
    if(e.target.classList&&e.target.classList.contains('btn')){$('gallery').scrollIntoView({behavior:'smooth'});}
  });
})();
</script>
</body>
</html>
